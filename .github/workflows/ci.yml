name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Format check
        run: |
          gofmt -l ./... > /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "Files not formatted:"
            cat /tmp/gofmt.out
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./internal/... -v -race

      - name: Integration tests
        run: go test ./test/... -v -race -tags=integration

      - name: Build
        run: go build -o bin/tabulum ./cmd/tabulum && go build -o bin/observe ./cmd/observe
