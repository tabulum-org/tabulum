# Tabulum Observation API Configuration
# All values shown are defaults — this file is optional for development.

server:
  listen_addr: ":8090"
  read_timeout: 30s
  write_timeout: 30s

kernel:
  event_log_dir: "./data/eventlog"
  state_db_path: "./data/state/state.db"
  registry_db_path: "./data/state/registry.db"
  transparency_log_path: "./data/transparency.jsonl"

rate_limit:
  requests_per_min_per_ip: 300

websocket:
  max_connections: 100
  write_timeout: 10s
  ping_interval: 30s
  max_duration: 24h
